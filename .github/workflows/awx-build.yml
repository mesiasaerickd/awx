name: AWX development image build
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/awx-build.yml'
      - 'requirements/**'
      - 'tools/ansible/**'
      - 'Makefile'
permissions:
  contents: read
concurrency:
  group: awx-dev-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Install Dockerfile generator
        run: python3 -m pip install --user ansible-core jinja2
      - name: Generate image recipe from upstream
        run: make Dockerfile HEADLESS=1
      - name: Build development image without pushing
        run: |
          docker build --file Dockerfile --build-arg VERSION=24.6.1.dev0 --build-arg SETUPTOOLS_SCM_PRETEND_VERSION=24.6.1.dev0 --build-arg HEADLESS=true --tag awx-dev:ci .
      - name: Check installed Python dependency consistency
        run: |
          docker run --rm --entrypoint /bin/bash awx-dev:ci -lc '/var/lib/awx/venv/awx/bin/python -m pip check'
      - name: Verify remediation candidate versions
        run: |
          docker run --rm --entrypoint /bin/bash awx-dev:ci -lc '/var/lib/awx/venv/awx/bin/python -c "import importlib.metadata as m; targets={\"PyJWT\":\"2.14.0\",\"dynaconf\":\"3.2.13\",\"msgpack\":\"1.2.1\",\"pyasn1\":\"0.6.4\",\"azure-core\":\"1.38.0\",\"jaraco.context\":\"6.1.0\",\"urllib3\":\"2.8.0\",\"protobuf\":\"6.33.5\",\"pyOpenSSL\":\"26.0.0\",\"cryptography\":\"46.0.5\"}; [(print(k, m.version(k)), (_ for _ in ()).throw(RuntimeError(k)) if m.version(k)!=v else None) for k,v in targets.items()] "'
      - name: Verify TLS and signature primitives in AWX Python environment
        run: |
          docker run --rm --entrypoint /var/lib/awx/venv/awx/bin/python awx-dev:ci -c 'import ssl, OpenSSL, cryptography; from cryptography.hazmat.primitives.asymmetric import ed25519; from cryptography import x509; key=ed25519.Ed25519PrivateKey.generate(); message=b"awx-ci-signature-test"; key.public_key().verify(key.sign(message), message); print("TLS, X509 imports and Ed25519 check OK")'
      - name: Verify setuptools release and vendored distributions
        run: |
          docker run --rm --entrypoint /var/lib/awx/venv/awx/bin/python awx-dev:ci -c 'import importlib.metadata as m; assert m.version("setuptools") == "82.0.0", m.version("setuptools"); print("setuptools", m.version("setuptools"))'
          docker run --rm --entrypoint /bin/bash awx-dev:ci -c 'find /var/lib/awx/venv/awx -type d \( -iname "jaraco.context-*.dist-info" -o -iname "wheel-*.dist-info" \) -print'
      - name: Record build image digest
        run: docker image inspect awx-dev:ci --format '{{.Id}}'

      - name: Locate installed copies of vulnerable Python packages
        run: |
          mkdir -p diagnostics
          docker run --rm --entrypoint /bin/bash awx-dev:ci -c '
            set -eu
            echo "=== AWX virtualenv package versions ==="
            /var/lib/awx/venv/awx/bin/python -m pip show cryptography twisted jaraco.context wheel || true
            echo "=== Additional installed distributions in image ==="
            find /usr /opt /var/lib/awx -type d \( -iname "jaraco.context-*.dist-info" -o -iname "wheel-*.dist-info" -o -iname "cryptography-*.dist-info" -o -iname "twisted-*.dist-info" \) -print 2>/dev/null || true
          ' | tee diagnostics/python-installations.txt
      - name: Save installed package locations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awx-python-installations
          path: diagnostics/python-installations.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Scan built image with Trivy (read-only, no publishing)
        run: |
          mkdir -p trivy-reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/trivy-reports:/reports" \
            aquasec/trivy:0.75.0 image \
            --image-src docker \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --format json \
            --output /reports/awx-trivy.json \
            awx-dev:ci
      - name: Summarize findings
        if: always()
        run: |
          if [ -f trivy-reports/awx-trivy.json ]; then
            python3 - <<'PY'
          import json, os
          with open('trivy-reports/awx-trivy.json') as f:
              data=json.load(f)
          counts={'CRITICAL':0,'HIGH':0}
          for result in data.get('Results',[]):
              for vuln in result.get('Vulnerabilities') or []:
                  severity=vuln.get('Severity')
                  if severity in counts: counts[severity]+=1
          line=f"Trivy awx: CRITICAL={counts['CRITICAL']}, HIGH={counts['HIGH']}"
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write(line+'\\n')
          PY
          fi
      - name: Save vulnerability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awx-trivy-report
          path: trivy-reports/awx-trivy.json
          if-no-files-found: warn
          retention-days: 30
